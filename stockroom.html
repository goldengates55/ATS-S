<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one-column phone app. Header, scrolling view, fixed bottom tab bar, slide-up sheets for forms.
   Look: shipping-label type (condensed caps + mono quantities) on cool grey, deep teal ink, signal orange for low stock. */
:root{
  --bg:#edf0f1; --surface:#ffffff; --ink:#14201f; --mute:#566665; --line:#d6dedf;
  --accent:#0f4c4a; --accent-ink:#ffffff; --alert:#c2410c; --ok:#15803d; --wash:#e4ebec;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1514; --surface:#152120; --ink:#e6efee; --mute:#93a5a3; --line:#263634;
  --accent:#4fd1c5; --accent-ink:#062321; --alert:#fb923c; --ok:#4ade80; --wash:#1d2d2c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1514; --surface:#152120; --ink:#e6efee; --mute:#93a5a3; --line:#263634;
  --accent:#4fd1c5; --accent-ink:#062321; --alert:#fb923c; --ok:#4ade80; --wash:#1d2d2c; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);padding-inline:16px;padding-block:0 96px;-webkit-text-size-adjust:100%}
.app{max-width:560px;margin-inline:auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;letter-spacing:.02em;text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font:600 12px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
header.top h1{font-size:28px;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg,.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--wash);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px;color:var(--mute)}
.banner button{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0}

.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.warn{background:transparent;color:var(--alert);border-color:var(--alert)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}

.hero{padding:6px 0 18px}
.hero .num{font:700 56px/1 var(--display);letter-spacing:.01em;margin-top:6px;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-block:1px solid var(--line);margin-bottom:22px}
.stats div{padding:12px 0;min-width:0}
.stats div+div{padding-left:14px;border-left:1px solid var(--line)}
.stats b{display:block;font:600 20px/1.2 var(--mono);margin-top:6px;overflow-wrap:anywhere}

section.block{margin-bottom:26px}
.block>.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.block>.head h2{font-size:22px;text-transform:uppercase}

.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:13px 14px;min-height:60px}
.item:first-child{border-top:0}
.item .main{min-width:0;flex:1}
.item .name{font-weight:600;overflow-wrap:anywhere}
.item .sub{font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.qty{font:600 24px/1 var(--mono);text-align:right;flex:none}
.qty small{display:block;font:500 11px/1.4 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.qty.low{color:var(--alert)}
#lock{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}#lock .box{width:100%;max-width:340px;text-align:center}
#lock input{text-align:center;font:600 28px var(--mono);letter-spacing:.3em;margin:14px 0 8px}
body.locked .app,body.locked .tabs,body.locked #overlay,body.locked #toast{display:none!important}
.line2{display:flex;gap:8px;align-items:center;margin-bottom:8px}.line2 input{flex:1;margin:0}.line2 .sub{white-space:nowrap}
.line .lexpw{grid-column:1/-1;margin:0}
.tag{display:inline-block;font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:6px;border:1px solid currentColor}
.tag.low{color:var(--alert)} .tag.completed{color:var(--ok)} .tag.draft{color:var(--mute)} .tag.cancelled{color:var(--mute);opacity:.7}
.empty{padding:26px 16px;text-align:center;color:var(--mute)}
.pos{color:var(--ok)} .neg{color:var(--alert)}

.tools{display:flex;gap:8px;margin-bottom:12px}
.tools input{flex:1}
input,select{width:100%;min-height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:12px}
label input,label select{margin-top:5px;color:var(--ink)}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chips.scroll{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}.chips.scroll .chip{flex:none}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;background:var(--wash)}
.photorow{display:flex;gap:10px;align-items:center;margin:0 0 12px}.photorow .pimg{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--wash);border:1px solid var(--line);flex:none}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.order{padding:14px;border-top:1px solid var(--line)}
.order:first-child{border-top:0}
.order .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.order .lines{font-size:14px;color:var(--mute);margin:6px 0 10px;overflow-wrap:anywhere}

.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
.tabs button{flex:1;min-width:0;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--mute);font-size:12px;font-weight:500}
.tabs button.on{color:var(--accent)}

.scrim{position:fixed;inset:0;background:rgba(5,12,12,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sheet h2{font-size:26px;text-transform:uppercase;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.line{display:grid;grid-template-columns:1fr 64px 84px 40px;gap:6px;margin-bottom:8px;align-items:center}
.line select,.line input{min-height:44px;padding:0 8px;margin:0}
.line button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--alert)}
.err{color:var(--alert);font-size:14px;min-height:20px;margin-bottom:6px}
textarea{width:100%;min-height:96px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px;font:12px/1.4 var(--mono)}
.sep{height:1px;background:var(--line);margin:18px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:90%;text-align:center}
.cobtn{display:flex;align-items:center;gap:6px;max-width:100%;min-width:0;background:none;border:0;padding:6px 0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit}
.cobtn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cobtn svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo{width:32px;height:32px;object-fit:contain;border-radius:6px;flex:none}
.logorow{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.logobox{width:72px;height:72px;border:1px dashed var(--line);border-radius:12px;display:grid;place-items:center;overflow:hidden;flex:none;background:var(--bg)}
.logobox img{max-width:100%;max-height:100%;object-fit:contain}
.rlogo{display:block;max-height:56px;max-width:60%;margin:0 auto 8px;object-fit:contain}
.savedline{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--mute);padding-bottom:8px}
.savedline.bad{color:var(--alert)}
.bars{display:flex;align-items:flex-end;gap:2px;height:110px;border-bottom:1px solid var(--line);padding-top:6px}
.bars i{flex:1;min-width:0;background:var(--accent);border-radius:3px 3px 0 0}
.bars i.z{height:2px;background:var(--line);border-radius:0}
.axis{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);margin-top:6px}
.receipt{border:1px dashed var(--line);border-radius:12px;padding:18px 16px;background:var(--bg)}
.rbiz{font:700 24px/1.1 var(--display);text-transform:uppercase;text-align:center;margin-bottom:4px;overflow-wrap:anywhere}
.receipt .sub{text-align:center;font-size:13px;color:var(--mute)}
.rl{margin:14px 0 8px;border-block:1px dashed var(--line);padding-block:6px}
.rrow{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.rrow span{min-width:0;overflow-wrap:anywhere}
.rrow small{display:block;color:var(--mute);font-size:12px}
.rtot{font-size:18px;font-weight:600}
.tabs button{font-size:11px}
.scanbox{margin-bottom:18px}
.hint{font-size:13px;color:var(--mute);margin:10px 0 0}
.actions{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.actions>*{flex:1;min-width:0}
.pick input[type=checkbox]{width:24px;height:24px;min-height:24px;flex:none;accent-color:var(--accent)}
.copies{width:64px;min-height:42px;text-align:center;flex:none;padding:0 6px}
.bcprev{display:flex;justify-content:center;margin:0 0 12px}
.bcprev canvas{max-width:100%;height:auto;border-radius:6px;border:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

  /* returns an error string, or applies the order and returns "" */
  function completeOrder(o) {

  /* ---------- customer and supplier statements ----------

      if (!((c.id && o.cid === c.id) || (o.party || "").trim().toLowerCase() === nm)) return;
      var tot = orderTotal(o), pays = o.pays ? o.pays : [{id: 0, amt: tot, date: o.date}];
      ev.push({d: o.date, k: 0, label: (o.kind === "sale" ? "Sale #" : "Purchase #") + orderNo(o), ch: tot, pd: 0});
      pays.forEach(function (p) { ev.push({d: p.date, k: 1, label: p.amt < 0 ? "Refund" : "Payment", ch: p.amt < 0 ? -p.amt : 0, pd: p.amt < 0 ? 0 : p.amt}); });

  /* ---------- returns ----------

  }

  /* ---------- saving files (CSV, images) ---------- */

  /* ---------- logo ---------- */
  /* shrinks the chosen picture to at most 200 px and keeps it as a small PNG inside this company's data */
  /* item photo: a small square JPEG (about 3 KB) so hundreds of items still fit in the browser's storage */
  function readPhoto(file, cb) {
    if (!file || !/^image\//.test(file.type)) { cb(null); return; }
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var N = 96, side = Math.min(img.width, img.height) || 1, sx = (img.width - side) / 2, sy = (img.height - side) / 2;
        var c = document.createElement("canvas"); c.width = N; c.height = N;
        var x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, N, N); x.drawImage(img, sx, sy, side, side, 0, 0, N, N);
        try { cb(okImg(c.toDataURL("image/jpeg", 0.6)) || null); } catch (e) { cb(null); }
      };
      img.onerror = function () { cb(null); };
      img.src = fr.result;
    };
    fr.onerror = function () { cb(null); };
    fr.readAsDataURL(file);
  }
  function readLogo(file, cb) {
    if (!file || !/^image\//.test(file.type)) { cb(null); return; }
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var k = Math.min(1, 200 / Math.max(img.width, img.height, 1)), w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
        var c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        try { cb(c.toDataURL("image/png"), w, h); } catch (e) { cb(null); }
      };
      img.onerror = function () { cb(null); };
      img.src = fr.result;
    };
    fr.onerror = function () { cb(null); };
    fr.readAsDataURL(file);
  }

  /* ---------- backup as PDF ----------
     Page 1 is readable. The following pages hold the data as small lines of text, "SR1|C|<n>|<base64>",
     (gzip-compressed JSON when the browser supports it) with a header line carrying the part count and a checksum.
     Restoring reads those lines back out of the PDF, so it only works with PDFs made here. */

  }

    packBackup().then(function (pk) {
      var d = new window.jspdf.jsPDF({unit: "mm", format: "a4", compress: false}), W = 210, M = 15, y = M + 4;
      d.setFont("helvetica", "bold"); d.setFontSize(20); d.setTextColor.apply(d, DARK); d.text(pdfSafe(T("Stockroom backup")), M, y);
      y += 7; d.setFont("helvetica", "normal"); d.setFontSize(10); d.setTextColor.apply(d, MUTE); d.text(pdfSafe(T("Created") + " " + new Date().toLocaleString(LOC())), M, y);
      y += 12; d.setFont("helvetica", "bold"); d.setFontSize(12); d.setTextColor.apply(d, DARK); d.text(pdfSafe(T("Companies in this backup")), M, y);
      y += 7; d.setFont("helvetica", "normal"); d.setFontSize(10);

        d.text(pdfSafe(x.biz + (x.town ? ", " + x.town : "") + ": " + cnt(x.products.length, "item", "items") + ", " + cnt(x.orders.length, "order", "orders") + ", " + cnt(x.contacts.length, "contact", "contacts")), M + 2, y, {maxWidth: W - M * 2 - 2});
        y += 6;

      d.text(how, M, y);

  /* cb(errorText) or cb(null, parsedBackup) */
  function readBackupPDF(file, cb) {
    var fr = new FileReader();
    fr.onerror = function () { cb("Could not read that file."); };
    fr.onload = function () {
      var txt = new TextDecoder("latin1").decode(new Uint8Array(fr.result));
      var h = /\(SR1\|H\|(gz|raw)\|(\d+)\|([0-9a-f]+)\)\s*Tj/.exec(txt);
      if (!h) { cb("This PDF is not a Stockroom backup."); return; }
      var n = +h[2], parts = new Array(n), got = 0, m, re = /\(SR1\|C\|(\d+)\|([A-Za-z0-9+\/=]*)\)\s*Tj/g;
      while ((m = re.exec(txt))) { var i = +m[1]; if (i < n && parts[i] === undefined) { parts[i] = m[2]; got++; } }
      if (got !== n) { cb("The backup is incomplete (found " + got + " of " + n + " parts)."); return; }
      var joined = parts.join("");
      if (hash(joined) !== h[3]) { cb("The backup is damaged."); return; }
      var bytes;
      try { bytes = unb64(joined); } catch (e) { cb("The backup is damaged."); return; }
      var done = function (u8) { var s; try { s = JSON.parse(new TextDecoder().decode(u8)); } catch (e) { cb("The backup could not be read."); return; } cb(null, s); };
      if (h[1] === "gz") {
        if (typeof DecompressionStream !== "function") { cb("This browser cannot open compressed backups."); return; }
        streamBytes(bytes, DecompressionStream, "gzip").then(done, function () { cb("The backup is damaged."); });
      } else done(bytes);

  }
  /* replaces the saved data with a parsed backup (all-companies or an older single-company one); false if it is not valid */
  function applyBackup(s) {
    var okd = function (d) { return d && Array.isArray(d.products) && Array.isArray(d.orders) && Array.isArray(d.moves); };
    if (s && s.v === 2 && Array.isArray(s.list) && s.list.length && s.list.every(function (c) { return c && typeof c.id === "number" && okd(c.data); })) {
      s.list.forEach(function (c) { migrate(c.data); unlink(c.data); });
      if (!s.list.some(function (c) { return c.id === s.active; })) s.active = s.list[0].id;
      s.seq = Math.max(s.seq || 0, Math.max.apply(null, s.list.map(function (c) { return c.id; })));
      stopAllSync(); ROOT = s; S = cur().data; tab = "home"; locSel = "all"; return true;
    }
    if (s && s.v === 1 && okd(s)) { stopSync(cur()); setData(migrate(s)); unlink(S); tab = "home"; locSel = "all"; return true; }
    return false;
  }

     and took out (p.mn) and reads what the others did (p.bs), and the stock is the sum, so two phones selling at once never overwrite each other.

  function bodyO(o) {

  function bodyM(x) {

        var u; try { u = window.claude.use("user"); } catch (e) { u = null; }
        if (u && u.then) u.then(function (us) { return us && us.can ? us.can("data.write") : null; }).then(function (v) { CANWRITE = v; }, function () {});
      }, function () { DBSTATE = "none"; });
    } else DBSTATE = "none";
  } catch (e) { DBSTATE = "none"; }

  /* ---------- PIN lock ----------
     A PIN keeps other people out of the app on this phone. It is a lock on the screen, not encryption: the data itself stays in the browser. */
  var PIN_KEY = "stockroom.pin", LOCKED = false, pinFails = 0, pinWait = 0, hiddenAt = 0;
  function pinCfg() { try { var o = JSON.parse(localStorage.getItem(PIN_KEY) || "null"); return o && o.o && o.salt ? o : null; } catch (e) { return null; } }
  function pinSave(c) { try { if (c) localStorage.setItem(PIN_KEY, JSON.stringify(c)); else localStorage.removeItem(PIN_KEY); return true; } catch (e) { return false; } }
  function pinHash(pin, salt) {
    var txt = salt + ":" + pin;
    if (window.crypto && crypto.subtle && window.TextEncoder) return crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)).then(function (b) { return Array.prototype.map.call(new Uint8Array(b), function (x) { return ("0" + x.toString(16)).slice(-2); }).join(""); });
    return Promise.resolve(hash(txt) + hash(txt.split("").reverse().join("")));
  }
  function showLock() {
    document.body.classList.add("locked");
    var el = $("#lock"); el.hidden = false;
    el.innerHTML = '<form class="box" id="lf" autocomplete="off"><h2 style="font-size:34px;text-transform:uppercase">' + esc(S.biz || "Stockroom") + '</h2><p style="color:var(--mute);margin:6px 0 0">Enter your PIN</p>' +
      '<input id="lp" type="password" inputmode="numeric" maxlength="8" autocomplete="off" aria-label="PIN"><div class="err" id="lerr"></div><button class="btn block">Unlock</button>' +
      '<button type="button" class="btn ghost sm" id="lforgot" style="margin-top:14px">Forgot your PIN?</button><p id="lnote" hidden style="color:var(--mute);font-size:14px;text-align:left">If you forget the owner PIN, the only way back in is to clear this site\'s data in your browser, which erases the data on this phone. If sync is on, the data comes back from the shared copy. Save a PDF backup before you rely on a PIN.</p></form>';
    $("#lforgot", el).onclick = function () { $("#lnote", el).hidden = false; };
    $("#lf", el).onsubmit = function (e) {
      e.preventDefault();
      var c = pinCfg(), v = $("#lp", el).value.trim(), er = $("#lerr", el);
      if (!c) { unlockApp("owner"); return; }
      if (Date.now() < pinWait) { er.textContent = "Too many tries. Wait a little and try again."; return; }
      pinHash(v, c.salt).then(function (h) {
        if (h === c.o) unlockApp("owner");
        else if (c.s && h === c.s) unlockApp("staff");
        else { pinFails++; $("#lp", el).value = ""; if (pinFails >= 5) { pinFails = 0; pinWait = Date.now() + 30000; er.textContent = "Too many tries. Wait a little and try again."; } else er.textContent = "Wrong PIN."; }
      });
    };
    setTimeout(function () { var i = $("#lp", el); if (i) i.focus(); }, 50);
  }
  function unlockApp(role) {
    ROLE = role; LOCKED = false; pinFails = 0;
    var el = $("#lock"); el.hidden = true; el.innerHTML = ""; document.body.classList.remove("locked");
    if (!OWN() && (tab === "reports")) tab = "home";
    render();
  }
  function lockApp() { if (!pinCfg()) return; LOCKED = true; closeSheet(); showLock(); }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) hiddenAt = Date.now();
    else if (hiddenAt && pinCfg() && !LOCKED && Date.now() - hiddenAt > 120000) lockApp();
  });
  function pinBlock() {
    var c = pinCfg(), h = '<div class="sep"></div><h3 style="font-size:20px;text-transform:uppercase;margin-bottom:6px">PIN lock</h3>' +
      '<p style="margin:0 0 10px;color:var(--mute);font-size:14px">A PIN keeps other people out of the app on this phone. The owner PIN opens everything. A staff PIN can sell, receive and count stock, but cannot see cost prices, profit, reports or settings, and cannot delete items. The lock is only on this phone.</p>';
    if (!c) return h + '<button type="button" class="btn ghost block" id="pin-set">Set a PIN</button>';
    return h + '<p style="margin:0 0 8px">' + (c.s ? 'Owner PIN and staff PIN are on.' : 'Owner PIN is on.') + '</p><div class="row" style="margin-bottom:8px"><button type="button" class="btn ghost" id="pin-set">Change PIN</button><button type="button" class="btn ghost" id="pin-staff">' + (c.s ? 'Change staff PIN' : 'Staff PIN') + '</button></div>' +
      '<div class="row">' + (c.s ? '<button type="button" class="btn warn" id="pin-nostaff">Remove staff PIN</button>' : '') + '<button type="button" class="btn warn" id="pin-off">Remove PIN</button><button type="button" class="btn" id="pin-lock">Lock now</button></div>';
  }
  function pinSheet(kind) {
    var c = pinCfg(), staff = kind === "staff";
    openSheet(staff ? "Staff PIN" : (c ? "Change PIN" : "Set a PIN"),
      '<form id="f" autocomplete="off">' + (staff ? '' : '<p class="hint" style="margin:0 0 12px">If you forget the owner PIN, the only way back in is to clear this site\'s data in your browser, which erases the data on this phone. Save a PDF backup first.</p>') +
      '<label>New PIN (4 to 8 digits)<input id="n1" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></label><label>Repeat the PIN<input id="n2" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></label><div class="err" id="err"></div><button class="btn block">Save PIN</button></form>',
      function (root) {
        $("#f", root).onsubmit = function (e) {
          e.preventDefault();
          var a = $("#n1", root).value.trim(), b = $("#n2", root).value.trim(), er = $("#err", root);
          if (!/^\d{4,8}$/.test(a)) { er.textContent = "Use 4 to 8 digits."; return; }
          if (a !== b) { er.textContent = "The two PINs do not match."; return; }
          var salt = c ? c.salt : rid(12);
          pinHash(a, salt).then(function (h) {
            if (staff && h === c.o) { er.textContent = "The staff PIN must be different from the owner PIN."; return; }
            var n = c ? Object.assign({}, c) : {salt: salt, s: null};
            if (staff) n.s = h; else { if (n.s === h) n.s = null; n.o = h; }
            if (!pinSave(n)) { er.textContent = "This browser is blocking storage, so the PIN cannot be saved."; return; }
            closeSheet(); render(); toast("PIN saved");
          });
        };
      });
  }
  function wirePinBlock(root) {
    var set = $("#pin-set", root), st = $("#pin-staff", root), ns = $("#pin-nostaff", root), off = $("#pin-off", root), lk = $("#pin-lock", root);
    if (set) set.onclick = function () { pinSheet("owner"); };
    if (st) st.onclick = function () { pinSheet("staff"); };
    if (ns) ns.onclick = function () { var c = pinCfg(); c.s = null; pinSave(c); settings(); toast("Staff PIN removed"); };
    if (off) off.onclick = function () { confirmSheet("Remove the PIN?", "Anyone who opens the app on this phone will see everything.", "Remove PIN", function () { pinSave(null); render(); toast("PIN removed"); }); };
    if (lk) lk.onclick = lockApp;
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]"); if (!t) return;
    var a = t.dataset.act;
    if (a === "scrim") { if (e.target === t) closeSheet(); return; }
    if (a === "close") closeSheet();
    else if (a === "tab") { tab = t.dataset.tab; render(); window.scrollTo(0, 0); }
    else if (a === "settings") { if (OWN()) settings(); }
    else if (a === "lock") lockApp();
    else if (a === "alert-go") { alertSeen = true; tab = "home"; render(); window.scrollTo(0, 0); }
    else if (a === "new-product") newProduct();
    else if (a === "open-product") openProduct(+t.dataset.id);
    else if (a === "new-order") newOrder(t.dataset.kind, t.dataset.pid ? +t.dataset.pid : 0);
    else if (a === "filter") { lowOnly = t.dataset.f === "low"; expOnly = t.dataset.f === "exp"; render(); }
    else if (a === "cat") { catSel = t.dataset.c || ""; render(); }
    else if (a === "loc") { locSel = t.dataset.l === "all" ? "all" : +t.dataset.l; render(); }
    else if (a === "writeoff") {
      var wp = prod(+t.dataset.id), wk = t.dataset.k;
      if (wp && wp.st[wk]) confirmSheet("Write off " + wp.st[wk] + " × " + wp.name + "?", "These expired units are taken out of stock and the change is logged as Expired.", "Write off", function () {
        var n = stDrop(wp, wk); addMove(wp, -n, "Expired" + (S.locs.length > 1 ? " · " + locName(kLoc(wk)) : "")); commit("Written off");
      });
    }
    else if (a === "seg") { ordKind = t.dataset.kind; render(); }
    else if (a === "complete") {
      var o = S.orders.filter(function (x) { return x.id === +t.dataset.id; })[0];
      var err = o && o.status === "draft" ? completeOrder(o) : "Order is not a draft.";
      if (err) toast(err); else commit("Order completed");
    }
    else if (a === "cancel") {
      var c = S.orders.filter(function (x) { return x.id === +t.dataset.id; })[0];
      if (c && c.status === "draft") { c.status = "cancelled"; commit("Order cancelled"); }
    }
    else if (a === "save-now") { var okSave = save(); render(); toast(okSave ? "Saved in this browser" : "Could not save in this browser"); }
    else if (a === "bc-find") { var bi = $("#bc-in"); bcFind(bi ? bi.value : "", false); }
    else if (a === "bc-photo") { var bf = $("#bc-file"); if (bf) bf.click(); }
    else if (a === "bc-upload") { var bu = $("#bc-upl"); if (bu) bu.click(); }
    else if (a === "bc-add") newProduct(t.dataset.code);
    else if (a === "bc-gen-all") {
      var made = 0; S.products.forEach(function (p) { if (!p.code) { p.code = makeCode(); made++; } });
      commit(made + (made === 1 ? " barcode created" : " barcodes created"));
    }
    else if (a === "bc-all" || a === "bc-none") { S.products.forEach(function (p) { bcPick(p.id).on = a === "bc-all"; }); render(); }
    else if (a === "bc-pdf") { try { labelsPDF(); } catch (err) { toast("Could not make the labels PDF"); } }
    else if (a === "companies") companiesSheet();
    else if (a === "new-company") newCompany();
    else if (a === "switch-co") { var id = +t.dataset.id; closeSheet(); if (id !== ROOT.active) { switchTo(id); toast("Opened " + S.biz); } }
    else if (a === "cash") cashSheet();
    else if (a === "cash-day") cashSheet(t.dataset.d);
    else if (a === "exp-add") { if (OWN()) expenseSheet(); }
    else if (a === "exp-edit") { var xe = S.exps.filter(function (x) { return x.id === +t.dataset.id; })[0]; if (xe && OWN()) expenseSheet(xe); }
    else if (a === "range") { range = t.dataset.r; render(); }
    else if (a === "export") exportCSV(t.dataset.x);
    else if (a === "export-pdf") { try { if (t.dataset.x === "stock") stockPDF(); else reportPDF(); } catch (err) { toast("Could not make the PDF"); } }
    else if (a === "owing") owingSheet();
    else if (a === "restock") restockSheet();
    else if (a === "return") { var rto = orderById(+t.dataset.id); if (rto && rto.status === "completed" && OWN()) returnSheet(rto); }
    else if (a === "stmt") { var sk = t.dataset.kind === "sale" ? "customer" : "supplier", sg = owingGroups(t.dataset.kind).filter(function (x) { return x.name === t.dataset.name; })[0], sc = findContact(t.dataset.name, t.dataset.kind) || {name: t.dataset.name, kind: sk, phone: sg ? sg.phone : ""}; statementSheet(sc); }
    else if (a === "wa-remind") { var wg = owingGroups("sale").filter(function (x) { return x.name === t.dataset.name; })[0]; if (wg) openWA(waLink(wg.phone, reminderText(wg))); }
    else if (a === "stocktake") { if (S.locs.length > 1 && locSel === "all" && !(S.count && S.count.loc)) toast("Choose a place first, then count it"); else stockCount(); }
    else if (a === "pay") { var po = orderById(+t.dataset.id); if (po && po.status === "completed") payForm(po, t.dataset.back ? owingSheet : null); }
    else if (a === "contacts") contactsSheet();
    else if (a === "new-contact") contactForm();
    else if (a === "open-contact") { var ct = S.contacts.filter(function (x) { return x.id === +t.dataset.id; })[0]; if (ct) contactForm(ct); }
    else if (a === "receipt") { var ro = S.orders.filter(function (x) { return x.id === +t.dataset.id; })[0]; if (ro) receiptSheet(ro); }
    else if (a === "clear-examples") {
      var ids = {}; S.products.forEach(function (p) { if (p.ex) ids[p.id] = 1; });
      S.products = S.products.filter(function (p) { return !p.ex; });
      S.moves = S.moves.filter(function (m) { return !ids[m.pid]; });
      S.examples = false; commit("Examples removed");
    }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });
  /* label choices (tick box and number of copies) are kept as you change them, without redrawing the page */
  document.addEventListener("change", function (e) {
    var t = e.target; if (!t || !t.dataset) return;
    if (t.dataset.sel) bcPick(+t.dataset.sel).on = t.checked;
    else if (t.dataset.n) { var n = Math.round(num(t.value)), s = bcPick(+t.dataset.n); s.n = isFinite(n) ? Math.min(99, Math.max(1, n)) : 1; t.value = s.n; }
  });

  /* file saving is offered by the viewer when available; the rest of the app works without it */
  try {
    if (window.claude && window.claude.use) window.claude.use("downloads").then(function (d) { DL = d; if (tab === "reports") render(); }, function () {});
  } catch (e) {}

  /* remembers which page you were on so the app reopens there (a convenience kept apart from your data) */
  var UI_KEY = "stockroom.ui";
  function saveUI() { try { localStorage.setItem(UI_KEY, JSON.stringify({tab: tab, ord: ordKind, range: range, low: lowOnly, exp: expOnly, loc: locSel, q: q})); } catch (e) {} }
  function restoreUI() {
    try {
      var u = JSON.parse(localStorage.getItem(UI_KEY) || "null"); if (!u) return;
      if (Object.prototype.hasOwnProperty.call(views, u.tab)) tab = u.tab;
      if (u.ord === "sale" || u.ord === "purchase") ordKind = u.ord;
      if (["7", "30", "90", "all"].indexOf(u.range) > -1) range = u.range;
      lowOnly = u.low === true; expOnly = u.exp === true && !lowOnly; if (u.loc === "all" || (typeof u.loc === "number" && isFinite(u.loc))) locSel = u.loc;
      q = typeof u.q === "string" ? u.q.slice(0, 80) : "";
    } catch (e) {}
  }
  restoreUI();
  /* only brand-new data is written on opening; otherwise just check that storage works, so opening never overwrites a newer save */
  if (FRESH) save();
  else { try { localStorage.setItem("stockroom.probe", "1"); localStorage.removeItem("stockroom.probe"); lastSaved = Date.now(); saveErr = false; } catch (e) { saveErr = true; } }
  document.documentElement.lang = LANG;
  startTr();
  if (pinCfg()) { LOCKED = true; ROLE = "staff"; showLock(); }   /* locked until a PIN is entered; nothing sensitive is shown meanwhile */
  render();
})();
</script>


</body></html>
